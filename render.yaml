# =============================================================================
# PEPEPS - Configuración de Despliegue Automático en Render (render.yaml)
# =============================================================================
services:
  - type: web
    name: pepeps-santander
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /catalogo
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "PEPEPS Santander"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        value: "base64:hO6JeH6xvLB+YyZnjLMtl9waMYndzOp3Qtkcny6ciuo="
      - key: APP_URL
        value: https://pepeps-santander.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mongodb
      - key: MONGODB_DATABASE
        value: pepeps
      - key: MONGODB_URI
        value: "mongodb+srv://ajaimes448_db_user:lYz3IabicSbGE8sL@cluster0.jujpaid.mongodb.net/pepeps?retryWrites=true&w=majority"
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: AUTH_MODEL
        value: App\Models\Usuario
